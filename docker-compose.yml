services:

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile

    container_name: rag-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - ai-gateway
    depends_on:
      - qdrant
        # condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: observe-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./qdrant:/qdrant/storage
      # - ./qdrant_data:/qdrant/storage -- when using named volume later on.

    restart: unless-stopped
    networks:
      - ai-gateway
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5  
    
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-gateway-prometheus

    restart: unless-stopped
    ports:
      - "9090:9090"

    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - ai-gateway    

  grafana:
    image: grafana/grafana-oss:latest
    container_name: ai-gateway-grafana

    restart: unless-stopped
    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - .infra/docker/grafana/provisioning:/var/grafana/provisioning
      - .infra/docker/grafana/dashboards:/var/grafana/dashboards

    depends_on:
      - prometheus

    networks:
      - ai-gateway


volumes:
  prometheus_data:

  grafana_data:

networks:
  ai-gateway:
    driver: bridge
