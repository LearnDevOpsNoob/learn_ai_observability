services:

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile

    container_name: rag-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - ai-gateway
    depends_on:
      - qdrant
        # condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: observe-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./qdrant:/qdrant/storage
      # - ./qdrant_data:/qdrant/storage -- when using named volume later on.

    restart: unless-stopped
    networks:
      - ai-gateway
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5  
    
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ai-gateway-prometheus

    restart: unless-stopped
    ports:
      - "9090:9090"

    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - ai-gateway    

  tempo:
    image: grafana/tempo:2.8.2
    container_name: ai-gateway-tempo
    restart: unless-stopped
    command: 
    - "-config.file=/etc/tempo/tempo.yaml"
    
    ports:
      - "3200:3200" # Tempo API
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

    volumes:
    - ./infra/docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    - tempo_data:/var/tempo

    networks:
      - ai-gateway

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: ai-gateway-alloy

    restart: unless-stopped

    command:
      - "run"
      - "/etc/alloy/config.alloy"

    ports:
      - "12345:12345" # Alloy UI

    volumes:
      - ./infra/docker/alloy/config.alloy:/etc/alloy/config.alloy:ro

    depends_on:
      - tempo
    networks:
      - ai-gateway


  grafana:
    image: grafana/grafana-oss:12.1.0
    container_name: ai-gateway-grafana

    restart: unless-stopped
    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus
      - alloy
      - tempo

    networks:
      - ai-gateway


volumes:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  ai-gateway:
    driver: bridge
