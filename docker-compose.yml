services:

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile

    container_name: rag-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app-net
    depends_on:
      - qdrant
        # condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: observe-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./qdrant:/qdrant/storage
      # - ./qdrant_data:/qdrant/storage -- when using named volume later on.

    restart: unless-stopped
    networks:
      - app-net
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5  
    
# volumes:
#   qdrant_data:

networks:
  app-net:
    driver: bridge
