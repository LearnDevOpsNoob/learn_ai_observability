services:

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile

    container_name: rag-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - ai-gateway
    depends_on:
      - qdrant
        # condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: observe-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./qdrant:/qdrant/storage
      # - ./qdrant_data:/qdrant/storage -- when using named volume later on.

    restart: unless-stopped
    networks:
      - ai-gateway
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5  
    
  # Infrastructure Observability (Grafana Stack)    
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ai-gateway-prometheus

    restart: unless-stopped
    ports:
      - "9090:9090"

    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - ai-gateway    

  tempo:
    image: grafana/tempo:2.8.2
    container_name: ai-gateway-tempo
    restart: unless-stopped
    command: 
    - "-config.file=/etc/tempo/tempo.yaml"
    
    ports:
      - "3200:3200" # Tempo API
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

    volumes:
    - ./infra/docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    - tempo_data:/var/tempo

    networks:
      - ai-gateway

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: ai-gateway-alloy

    restart: unless-stopped

    command:
      - "run"
      - "/etc/alloy/config.alloy"

    ports:
      - "12345:12345" # Alloy UI

    volumes:
      - ./infra/docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - tempo
    networks:
      - ai-gateway

  loki:
    image: grafana/loki:3.4.2
    container_name: ai-gateway-loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    command:
      - "-config.file=/etc/loki/config.yaml"

    volumes:
      - ./infra/docker/loki/config.yaml:/etc/loki/config.yaml
      - loki_data:/loki

    networks:
      - ai-gateway  

  grafana:
    image: grafana/grafana-oss:12.1.0
    container_name: ai-gateway-grafana

    restart: unless-stopped
    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus
      - alloy
      - tempo
      - loki

    networks:
      - ai-gateway

  # //AI Observability

  postgres:
    image: postgres:16
    container_name: langfuse-postgres
    
    restart: unless-stopped

    env_file:
      - .langfuse.env

    volumes:
      - langfuse_postgres:/var/lib/postgresql/data
    
    networks:
      - ai-gateway    
      
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: langfuse-clickhouse

    restart: unless-stopped

    env_file:
      - .langfuse.env
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
    networks:
      - ai-gateway


  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: langfuse-minio

    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file:
      - .langfuse.env
      
    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - langfuse_minio:/data

    networks:
      - ai-gateway   

  redis:
    image: redis:7
    container_name: langfuse-redis

    restart: unless-stopped

    command: >
      sh -c "redis-server
      --requirepass $$REDIS_AUTH
      --maxmemory-policy noeviction"
      
    env_file:
      - .langfuse.env

    volumes:
      - langfuse_redis:/data

    networks:
      - ai-gateway    

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse-web

    restart: unless-stopped

    env_file:
      - .langfuse.env

    depends_on:
      - postgres
      - clickhouse
      - minio
      - redis

    ports:
      - "3001:3000"

    networks:
      - ai-gateway

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker

    restart: unless-stopped

    env_file:
      - .langfuse.env

    depends_on:
      - postgres
      - clickhouse
      - minio
      - redis

    networks:
      - ai-gateway    

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:

  langfuse_postgres:
  langfuse_clickhouse:
  langfuse_minio:
  langfuse_redis:

networks:
  ai-gateway:
    driver: bridge
